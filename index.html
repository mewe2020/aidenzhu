<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aiden Zhu</title>
  <meta name="description" content="Aiden Zhu, student, entrepreneur and developer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.css" />
  <link rel="stylesheet" href="styles.css?v=23" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff6b35'/></svg>" />
</head>
<body>
  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__top">
        <p class="h6-head" id="location"></p>
        <a class="small" id="emailTop"></a>
      </div>

      <div class="hero__mid">
        <div class="hero__photo" id="heroPhoto"></div>
        <h1 class="pop-words" id="name"></h1>
        <div class="hero__images" id="heroImages"></div>
        <h2 class="hero__roles pop-words" id="roles"></h2>
      </div>
    </section>

    <!-- BY THE NUMBERS -->
    <section class="block" id="impact">
      <div class="text-block">
        <h4 class="text-block__title pop-words">What I've done so far</h4>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <!-- FEATURED -->
    <section class="block" id="featured">
      <div class="text-block">
        <h4 class="text-block__title pop-words">Featured Work</h4>
        <p class="text-block__description">Things I'm proud of</p>
      </div>
      <div class="carousel" id="carousel">
        <div class="carousel__track" id="track"></div>
      </div>
      <!-- big framed showcases, still part of Featured Work -->
      <div class="cases" id="caseList"></div>
    </section>

    <!-- STORY -->
    <section class="block" id="story">
      <div class="text-block">
        <h4 class="text-block__title pop-words">My High School Journey</h4>
      </div>
      <ol class="story" id="storySteps"></ol>
    </section>

    <!-- MORE -->
    <section class="block" id="more">
      <div class="text-block">
        <h4 class="text-block__title pop-words">More Work</h4>
        <p class="text-block__description">Smaller projects and experiments</p>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- CONTACT -->
    <section class="contact block">
      <h2 class="contact__title pop-words">Get in Touch</h2>
      <a class="button button--big" id="emailBig"></a>
      <p class="small" id="copied" role="status"></p>
      <nav class="contact__links" id="socials"></nav>
    </section>
  </main>

  <!-- Floating: about avatar (top-right) -->
  <button class="fab fab--about" id="aboutBtn" aria-label="About me">
    <span id="avatar"></span>
  </button>

  <!-- Floating: color picker (bottom-right) -->
  <div class="color-picker" id="picker">
    <div class="color-picker__swatches" id="swatches"></div>
    <button class="fab color-picker__toggle" id="pickerToggle" aria-label="Change colors" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16c3.3 0 6-2.7 6-6C22 5.9 17.5 2 12 2Zm-5.5 10a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg>
    </button>
  </div>

  <!-- Project modal -->
  <dialog class="modal" id="modal" data-lenis-prevent>
    <div class="modal__inner">
      <button class="button button--icon modal__close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal__art" id="modalArt"></div>
      <div class="modal__body">
        <p class="h6-head" id="modalMeta"></p>
        <h3 id="modalTitle"></h3>
        <p class="modal__summary" id="modalSummary"></p>
        <div class="metrics" id="modalMetrics"></div>
        <div id="modalBody"></div>
        <a class="button" id="modalLink" target="_blank" rel="noopener">Visit</a>
      </div>
    </div>
  </dialog>

  <!-- About modal -->
  <dialog class="modal modal--about" id="about" data-lenis-prevent>
    <div class="modal__inner">
      <button class="button button--icon modal__close" data-close aria-label="Close">✕</button>
      <div class="about__photo" id="aboutPhoto"></div>
      <div class="modal__body">
        <p class="h6-head">About Me</p>
        <h3 id="aboutName"></h3>
        <p class="modal__summary" id="aboutIntro"></p>
        <div id="aboutBody"></div>
        <dl class="facts" id="aboutFacts"></dl>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="illustrations.js?v=15"></script>
  <script src="content.js?v=32"></script>
  <script src="main.js?v=19"></script>
</body>
</html>
